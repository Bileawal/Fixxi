name: fixxi
description: Fixxi - Home repair & technician booking (FYP)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  http: ^1.2.2
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.1.3
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.2.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  mailer: ^7.2.0
  speech_to_text: ^7.0.0
  googleapis_auth: ^2.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#F57C00"
  adaptive_icon_foreground: assets/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/Dataset.json
    - assets/service_account.json
